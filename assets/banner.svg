<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="kitbag — everything this machine holds that is yours">
  <title>kitbag</title>
  <style>
    .body { fill: #16181d; }
    .handle { stroke: #16181d; }
    .part { fill: #6366f1; }
    .name { fill: #16181d; font: 600 52px ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif; letter-spacing: -1.5px; }
    .tag  { fill: #16181d; opacity: .62; font: 400 18px ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .body { fill: #e6edf3; } .handle { stroke: #e6edf3; } .part { fill: #818cf8; }
      .name, .tag { fill: #e6edf3; }
    }
  </style>
  <g transform="translate(44 44) scale(1.15)">
    <path class="handle" d="M23.5 23v-3.5a8.5 8.5 0 0 1 17 0V23" fill="none" stroke-width="3.6" stroke-linecap="round"/>
    <mask id="kb"><rect x="6" y="23" width="52" height="34" rx="10" fill="#fff"/><rect x="43" y="23" width="2.6" height="34" fill="#000"/></mask>
    <g mask="url(#kb)">
      <rect class="body" x="6" y="23" width="52" height="34" rx="10"/>
      <rect class="part" x="45.6" y="23" width="12.4" height="34"/>
    </g>
  </g>
  <text class="name" x="132" y="84">kitbag</text>
  <text class="tag" x="134" y="112">Everything this machine holds that is yours</text>
</svg>
