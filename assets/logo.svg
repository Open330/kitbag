<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="kitbag">
  <title>kitbag</title>
  <desc>A bag you carry, with one part of what is inside kept separate.</desc>
  <style>
    .body { fill: #16181d; }
    .handle { stroke: #16181d; }
    .part { fill: #6366f1; }
    @media (prefers-color-scheme: dark) {
      .body { fill: #e6edf3; }
      .handle { stroke: #e6edf3; }
      .part { fill: #818cf8; }
    }
  </style>
  <path class="handle" d="M23.5 23v-3.5a8.5 8.5 0 0 1 17 0V23" fill="none" stroke-width="3.6" stroke-linecap="round"/>
  <mask id="k">
    <rect x="6" y="23" width="52" height="34" rx="10" fill="#fff"/>
    <rect x="43" y="23" width="2.6" height="34" fill="#000"/>
  </mask>
  <g mask="url(#k)">
    <rect class="body" x="6" y="23" width="52" height="34" rx="10"/>
    <rect class="part" x="45.6" y="23" width="12.4" height="34"/>
  </g>
</svg>
