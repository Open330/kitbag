<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="kitbag">
  <title>kitbag</title>
  <desc>A kit bag whose contents are sorted into three bands: personal, shared and work.</desc>

  <!-- The bag. Rounded, soft, carried - not a safe, not a lock: the point is
       that things move, not that they are sealed away. -->
  <defs>
    <clipPath id="bag">
      <path d="M12 46h104a8 8 0 0 1 8 8v46a12 12 0 0 1-12 12H16a12 12 0 0 1-12-12V54a8 8 0 0 1 8-8z"/>
    </clipPath>
  </defs>

  <!-- Handles: two straps over the top, the thing that makes it a bag you take
       with you rather than a box you leave behind. -->
  <path d="M44 46V34a20 20 0 0 1 40 0v12" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" opacity="0.85"/>

  <!-- Body -->
  <path d="M12 46h104a8 8 0 0 1 8 8v46a12 12 0 0 1-12 12H16a12 12 0 0 1-12-12V54a8 8 0 0 1 8-8z" fill="currentColor" opacity="0.12"/>
  <path d="M12 46h104a8 8 0 0 1 8 8v46a12 12 0 0 1-12 12H16a12 12 0 0 1-12-12V54a8 8 0 0 1 8-8z" fill="none" stroke="currentColor" stroke-width="7" stroke-linejoin="round"/>

  <!-- What is inside, sorted. Three bands, never mixed: the whole idea of the
       tool in the one place a logo has room for it. -->
  <g clip-path="url(#bag)">
    <rect x="22" y="62" width="84" height="10" rx="5" fill="#3fb950"/>
    <rect x="22" y="78" width="60" height="10" rx="5" fill="#a371f7"/>
    <rect x="22" y="94" width="72" height="10" rx="5" fill="#d29922"/>
  </g>
</svg>
