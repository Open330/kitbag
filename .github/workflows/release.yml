name: release

# A tag ships binaries for the four targets the installer knows how to ask
# for, and the checksums it refuses to install without.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # A tag builds only if the tree it points at passes what `ci` asks of every
  # push. Without this a red build still ships: eight releases went out over a
  # clippy error that nobody was looking at, because the release job never
  # asked and the CI run it was racing was a different run.
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: cross linker for aarch64 linux
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --target ${{ matrix.target }} -p kitbag-cli
      - name: package
        run: |
          tar -czf "kitbag-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" kitbag
      - uses: actions/upload-artifact@v4
        with:
          name: kitbag-${{ matrix.target }}
          path: kitbag-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum kitbag-*.tar.gz > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kitbag-*.tar.gz
            checksums.txt
          generate_release_notes: true
