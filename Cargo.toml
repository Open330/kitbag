[workspace]
members = ["crates/kitbag-core", "crates/kitbag-catalog", "crates/kitbag-providers", "crates/kitbag-vault", "crates/kitbag-cli"]
resolver = "2"

[workspace.package]
version = "0.15.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/Open330/kitbag"
description = "Everything this machine holds that is yours: what it is, whose it is, and how it gets onto the next machine"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
